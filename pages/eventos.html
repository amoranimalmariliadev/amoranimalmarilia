<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos - ONG Amor Animal Marília</title>
  <link rel="stylesheet" href="../static/css/default.css">
  <link rel="stylesheet" href="../static/css/icons/bootstrap-icons.min.css">
  <link rel="icon" type="image/png" href="../static/css/favicon/ong.ico">
  <style>
    .evento-foto-wrap {
      width: 100%; height: 280px; overflow: hidden;
      background: var(--bg-alt);
      display: flex; align-items: center; justify-content: center;
    }
    .evento-foto-wrap img {
      width: 100%; height: 100%; object-fit: contain; display: block;
    }
    .btn-evento-insta {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 12px; padding: 8px 18px;
      border-radius: 24px; font-size: 0.85rem; font-weight: 600;
      color: #fff !important; text-decoration: none;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 2px 8px rgba(220,39,67,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-evento-insta:hover {
      transform: translateY(-2px); box-shadow: 0 4px 14px rgba(220,39,67,0.45);
      color: #fff; text-decoration: none;
    }
    .btn-evento-insta i { font-size: 1rem; line-height: 1; }
    .btn-delete-evento {
      position: absolute; top: 8px; right: 8px; z-index: 20;
      width: 32px; height: 32px; border-radius: 50%;
      border: none; background: rgba(220,38,38,0.9); color: #fff;
      font-size: 0.85rem; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      transition: background 0.2s; line-height: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .btn-delete-evento:hover { background: rgb(185,28,28); transform: scale(1.08); }
    .btn-delete-evento i { line-height: 1; }
    body.admin-mode .btn-delete-evento { display: flex; }
    #eventos-container .card { position: relative; overflow: hidden; }
    .btn-sync-insta {
      display: none; align-items: center; gap: 8px;
      padding: 8px 18px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, #0f766e, #14b8a6); color: #fff;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
      box-shadow: 0 2px 8px rgba(13,148,136,0.35); transition: all 0.2s ease;
    }
    .btn-sync-insta:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(13,148,136,0.45); }
    .btn-sync-insta:disabled { opacity: 0.7; cursor: wait; }
    body.admin-mode .btn-sync-insta { display: inline-flex; }
    @media (max-width: 768px) {
      .evento-foto-wrap { height: 200px; }
    }
  </style>
</head>
<body>

<script>var ROOT='..';</script>
<script src="../components/header.js"></script>

<main class="main-content">
  <div class="container py-5">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:1.5rem;">
      <h2 style="margin:0;">Eventos</h2>
      <button class="btn-sync-insta admin-only" style="display:none;" onclick="sincronizarInstagram(this)" title="Buscar novas postagens do Instagram">
        <i class="bi bi-arrow-repeat"></i> Sincronizar Instagram
      </button>
    </div>
    <div class="row" id="eventos-container"></div>

    <a href="../index.html" class="button btn-secondary mt-3">Voltar</a>
  </div>
</main>

<script src="../components/footer.js"></script>
<script src="../static/js/api.js"></script>
<script>
var API_BASE = window.API_BASE;
var INSTAGRAM_URL = 'https://www.instagram.com/grupoamoranimal/';

function esc(s) {
  if (!s) return '';
  var e = document.createElement('div');
  e.appendChild(document.createTextNode(s));
  return e.innerHTML;
}

function imgEventoUrl(f) {
  if (!f) return '';
  if (f.indexOf('://') !== -1 || f.indexOf('data:') === 0) return f;
  return API_BASE + '/uploads/eventos/' + f;
}

function fmtData(d) {
  if (!d) return '';
  var partes = d.split('T')[0].split('-');
  if (partes.length === 3 && partes[0].length === 4) return partes[2] + '/' + partes[1] + '/' + partes[0];
  var dt = new Date(d);
  if (!isNaN(dt.getTime())) {
    return String(dt.getUTCDate()).padStart(2,'0') + '/' + String(dt.getUTCMonth()+1).padStart(2,'0') + '/' + dt.getUTCFullYear();
  }
  return d;
}

apiFetch('/eventos')
  .then(function(r) { return r.json(); })
  .then(function(eventos) {
    var container = document.getElementById('eventos-container');
    if (!eventos || !eventos.length) {
      container.innerHTML = '<div class="col-12 text-center text-muted py-5">Nenhum evento cadastrado.</div>';
      return;
    }
    var criadoEm = function (ev) {
      var t = ev.created_at ? new Date(ev.created_at).getTime() : NaN;
      return isNaN(t) ? (parseInt(ev.id, 10) || 0) : t;
    };
    eventos.slice().sort(function (a, b) { return criadoEm(b) - criadoEm(a); }).forEach(function(ev) {
      var col = document.createElement('div');
      col.className = 'col-md-4 mb-4';
      var instaUrl = ev.link || ev.url_instagram || INSTAGRAM_URL;
      col.innerHTML =
        '<div class="card h-100">' +
          '<button class="btn-delete-evento" data-id="' + ev.id + '" title="Excluir evento"><i class="bi bi-x-lg"></i></button>' +
          (ev.fotos || ev.arquivo ? '<div class="evento-foto-wrap"><img src="' + imgEventoUrl(ev.fotos || ev.arquivo) + '" class="card-img-top" alt="' + esc(ev.titulo) + '" loading="lazy"></div>' : '') +
          '<div class="card-body">' +
            '<h5 class="card-title">' + esc(ev.titulo) + '</h5>' +
            '<p class="card-subtitle text-muted">' + fmtData(ev.data_evento) + '</p>' +
            '<p class="card-text">' + esc(ev.descricao) + '</p>' +
            '<a class="btn-evento-insta" href="' + instaUrl + '" target="_blank" rel="noopener noreferrer" title="Ver no Instagram"><i class="bi bi-instagram"></i> Ver no Instagram</a>' +
          '</div>' +
          (ev.status ? '<div class="card-footer d-flex justify-content-between"><span class="badge" style="background: var(--brand-teal); color: white;">' + esc(ev.status) + '</span></div>' : '') +
        '</div>';
      container.appendChild(col);
    });
  })
  .catch(function() {
    document.getElementById('eventos-container').innerHTML = '<div class="col-12 text-center text-muted py-5">Erro ao carregar eventos.</div>';
  });

document.addEventListener('click', function(e) {
  var btn = e.target.closest('.btn-delete-evento');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  var id = btn.dataset.id;
  if (!confirm('Tem certeza que deseja excluir este evento? Esta ação não pode ser desfeita.')) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span>';
  apiFetch('/eventos/' + encodeURIComponent(id), { method: 'DELETE' })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var col = btn.closest('.col-md-4');
      if (col) col.remove();
    })
    .catch(function(err) {
      alert('Erro ao excluir evento: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-x-lg"></i>';
    });
});

async function sincronizarInstagram(btn) {
  if (btn.disabled) return;
  btn.disabled = true;
  var htmlOriginal = btn.innerHTML;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Sincronizando…';
  try {
    var r = await apiFetch('/eventos/sync-instagram', { method: 'POST' });
    var d = await r.json();
    if (d.success && d.publicados > 0) {
      alert('✅ ' + d.publicados + ' novo(s) post(s) publicado(s)!' + (d.sem_foto ? ' (' + d.sem_foto + ' sem foto)' : ''));
      location.reload();
    } else if (d.success) {
      alert('Nenhuma novidade no Instagram.\nÚltima publicação do site: ' + (d.cutoff || '-'));
      btn.disabled = false;
      btn.innerHTML = htmlOriginal;
    } else {
      throw new Error(d.error || 'Falha na sincronização');
    }
  } catch (e) {
    alert('Erro na sincronização: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = htmlOriginal;
  }
}
</script>

</body>
</html>
