<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste mobile - carrosséis</title>
<style>
  html,body { margin:0; padding:0; }
  #frame { width: 390px; height: 844px; border:0; }
  pre { font: 12px monospace; }
</style>
</head>
<body>
<iframe id="frame" src="/index.html"></iframe>
<pre id="out">rodando...</pre>
<script>
var SEL = ['.events-grid', '.procura-grid', '.mutirao-carrossel', '.pet-carousel', '.voluntarios-carrossel', '.parcerias-grid'];
function coletar() {
  var doc = document.getElementById('frame').contentDocument;
  var out = [];
  SEL.forEach(function(sel) {
    var el = doc.querySelector(sel);
    if (!el) { out.push(sel + ' => NAO ENCONTRADO'); return; }
    var cs = doc.defaultView.getComputedStyle(el);
    out.push([
      sel,
      'itens=' + el.children.length,
      'clientW=' + el.clientWidth,
      'scrollW=' + el.scrollWidth,
      'overflowX=' + cs.overflowX,
      'scrollable=' + (el.scrollWidth > el.clientWidth + 1),
      'anim=' + cs.animationName,
      'snap=' + cs.scrollSnapType,
      'inlineOverflowX=' + (el.style.overflowX || '-')
    ].join(' | '));
  });
  // cards dentro dos carrosséis
  var ev = doc.querySelector('.events-grid > .event-card-hover');
  if (ev) {
    var cse = doc.defaultView.getComputedStyle(ev);
    out.push('card evento: width=' + Math.round(ev.getBoundingClientRect().width) + ' flexBasis=' + cse.flexBasis);
  }
  var pet = doc.querySelector('.pet-carousel-item');
  if (pet) {
    var csp = doc.defaultView.getComputedStyle(pet);
    out.push('card pet: width=' + Math.round(pet.getBoundingClientRect().width) + ' flexBasis=' + csp.flexBasis);
  }
  var body = doc.body;
  out.push('body scrollWidth=' + doc.documentElement.scrollWidth + ' (viewport 390)');
  document.getElementById('out').textContent = out.join('\n');
}
document.getElementById('frame').addEventListener('load', function () {
  setTimeout(coletar, 6000);
});
</script>
</body>
</html>
