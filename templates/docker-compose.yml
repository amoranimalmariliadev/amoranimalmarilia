services:
  db:
    image: postgres:16-alpine
    container_name: {{APP_NAME}}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-{{DB_NAME}}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-{{ADMIN_EMAIL}}}
      ADMIN_NOME: ${ADMIN_NOME:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-@admin}
    volumes:
      - ${DATA_DIR}/pgdata:/var/lib/postgresql/data
      - ./db/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init/02-seed.sh:/docker-entrypoint-initdb.d/02-seed.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-{{DB_NAME}}}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: {{APP_NAME}}-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-amoranimal}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-{{DB_NAME}}}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      API_TOKEN: ${API_TOKEN}
      # IG_* vêm do arquivo `.env` na PASTA do docker-compose (não do arquivo
      # `env` do servidor). Depois de editar o .env, recrie o container com
      # `docker compose up -d` — `docker compose restart` NÃO relê o .env.
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      IG_USER_ID: ${IG_USER_ID:-}
      IG_APP_ID: ${IG_APP_ID:-}
      IG_APP_SECRET: ${IG_APP_SECRET:-}
      IG_DISCOVERY_USERNAME: ${IG_DISCOVERY_USERNAME:-}
      IG_GRAPH_VERSION: ${IG_GRAPH_VERSION:-}
    volumes:
      - ${DATA_DIR}/uploads:/app/uploads
      - ${DATA_DIR}/backups:/app/backups
      # Pasta de deploy montada somente-leitura: o server.js relê /app/host/.env
      # em runtime (sem recriar o container). Além disso o .env fica visível como
      # /app/.env. Montar a PASTA (e não o arquivo) evita que o bind-mount fique
      # "preso" a um inode antigo quando o editor regrava o .env.
      - ${DATA_DIR}:/app/host:ro
      - ${DATA_DIR}/.env:/app/.env:ro
    ports:
      - "${PORT:-3000}:3000"
